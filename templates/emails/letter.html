{% comment %}
One shell, every letter — turn 9a.

Built as nested tables with inline styles, which is the honest translation
of a design drawn in flexbox: Outlook and a good half of the mail clients
in use do not lay out with flex or read a <style> block, and a letter that
collapses in the client somebody actually opens is worse than one that
never looked like the drawing. Every value here is the frame's — 560px,
Georgia, #26331f bar, #fdfcf8 ground, the 88x68 thumb, the hairlines.

Nothing depends on an image loading: the wordmark is text, the item
photograph sits on a filled cell, and every fact is in the words.

Context: letter (from notifications.letters.build), site_url.
{% endcomment %}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ letter.subject }}</title>
</head>
<body style="margin: 0; padding: 0; background: #e8e4da; -webkit-text-size-adjust: 100%;">
    {# The preview line — what shows beside the subject in an inbox list. #}
    <div style="display: none; max-height: 0; overflow: hidden; opacity: 0;">
        {{ letter.lead|default:letter.subject }}
    </div>

    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background: #e8e4da;">
        <tr>
            <td align="center" style="padding: 22px 12px;">

                <table role="presentation" width="560" cellpadding="0" cellspacing="0" border="0"
                       style="width: 560px; max-width: 560px; background: #fdfcf8; border: 1px solid #ddd7c8;">

                    {# ── Masthead ────────────────────────────────── #}
                    <tr>
                        <td style="background: #26331f; padding: 16px 24px;">
                            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                                <tr>
                                    <td style="font-family: Georgia, 'Times New Roman', serif; font-size: 20px; font-weight: 700; color: #f4f1e8; letter-spacing: -0.01em;">
                                        KeystoneBid
                                    </td>
                                    <td align="right" style="font-family: Georgia, 'Times New Roman', serif; font-size: 12px; color: #a2a598;">
                                        {{ letter.date }}
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    {# ── The letter ──────────────────────────────── #}
                    <tr>
                        <td style="padding: 26px 24px 22px;">

                            <p style="margin: 0; font-family: Georgia, 'Times New Roman', serif; font-size: 23px; font-weight: 700; line-height: 1.25; color: #26331f;">
                                {{ letter.headline }}
                            </p>

                            {% if letter.lead %}
                                <p style="margin: 14px 0 0; font-family: Georgia, 'Times New Roman', serif; font-size: 14px; line-height: 1.6; color: #4d5245;">
                                    {{ letter.lead }}
                                </p>
                            {% endif %}

                            {% if letter.item %}
                                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
                                       style="margin-top: 14px; border-top: 1px solid #e3ddce; border-bottom: 1px solid #e3ddce;">
                                    <tr>
                                        <td style="padding: 14px 0;">
                                            <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                                                <tr>
                                                    <td width="88" valign="top" style="width: 88px; padding-right: 14px;">
                                                        {% if letter.item.image_url %}
                                                            <img src="{{ site_url }}{{ letter.item.image_url }}" width="88" height="68" alt=""
                                                                 style="display: block; width: 88px; height: 68px; border: 1px solid #e3ddce; object-fit: cover; background: #ece7db;">
                                                        {% else %}
                                                            <div style="width: 88px; height: 68px; background: #ece7db; border: 1px solid #e3ddce;">&nbsp;</div>
                                                        {% endif %}
                                                    </td>
                                                    <td valign="top">
                                                        <p style="margin: 0; font-family: Georgia, 'Times New Roman', serif; font-size: 15px; font-weight: 700; line-height: 1.3; color: #1c1f18;">
                                                            {{ letter.item.title }}
                                                        </p>
                                                        {% for fact in letter.item.facts %}
                                                            <p style="margin: 3px 0 0; font-family: Georgia, 'Times New Roman', serif; font-size: 13px; line-height: 1.5; color: #6b6f60;">
                                                                {{ fact }}
                                                            </p>
                                                        {% endfor %}
                                                    </td>
                                                </tr>
                                            </table>
                                        </td>
                                    </tr>
                                </table>
                            {% endif %}

                            {% if letter.options %}
                                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
                                       style="margin-top: 14px; border-top: 1px solid #e3ddce; border-bottom: 1px solid #e3ddce;">
                                    <tr>
                                        <td style="padding: 14px 0;">
                                            {% for lead, rest in letter.options %}
                                                <p style="margin: {% if not forloop.first %}7px{% else %}0{% endif %} 0 0; font-family: Georgia, 'Times New Roman', serif; font-size: 13.5px; line-height: 1.55; color: #1c1f18;">
                                                    <strong>{{ lead }}</strong> {{ rest }}
                                                </p>
                                            {% endfor %}
                                        </td>
                                    </tr>
                                </table>
                            {% endif %}

                            {% if letter.action %}
                                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin-top: 18px;">
                                    <tr>
                                        <td align="center"
                                            style="background: {% if letter.action.tone == 'brass' %}#a07a26{% else %}#26331f{% endif %};">
                                            <a href="{{ site_url }}{{ letter.action.url }}"
                                               style="display: block; padding: 14px 24px; font-family: Georgia, 'Times New Roman', serif; font-size: 15px; font-weight: 700; color: {% if letter.action.tone == 'brass' %}#1b2416{% else %}#ffffff{% endif %}; text-decoration: none; text-align: center;">
                                                {{ letter.action.label }}
                                            </a>
                                        </td>
                                    </tr>
                                </table>
                            {% endif %}

                            {% if letter.closing %}
                                <p style="margin: 16px 0 0; font-family: Georgia, 'Times New Roman', serif; font-size: 13px; line-height: 1.55; color: #4d5245;">
                                    {{ letter.closing }}
                                </p>
                            {% endif %}
                        </td>
                    </tr>

                    {# ── Why it arrived ──────────────────────────── #}
                    <tr>
                        <td style="border-top: 1px solid #e3ddce; background: #f4f1e8; padding: 16px 24px;">
                            <p style="margin: 0; font-family: Georgia, 'Times New Roman', serif; font-size: 12px; line-height: 1.55; color: #6b6f60;">
                                {{ letter.reason }}
                                {% if letter.can_opt_out %}
                                    <a href="{{ site_url }}{{ settings_path }}" style="color: #a07a26;">Change what we send you</a> &middot;
                                {% endif %}
                                <a href="{{ site_url }}/" style="color: #a07a26;">keystonebid.com</a>
                            </p>
                            <p style="margin: 5px 0 0; font-family: Georgia, 'Times New Roman', serif; font-size: 12px; line-height: 1.55; color: #8c8f80;">
                                {{ letter.sign_off }}
                            </p>
                        </td>
                    </tr>

                </table>
            </td>
        </tr>
    </table>
</body>
</html>
